name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out docs
        uses: actions/checkout@v6
        with:
          path: docs/site
      - name: Check out the library
        uses: actions/checkout@v6
        with:
          repository: lawsonisthebest/higgyui
          ref: b7edfa8ecc0ada56ad5486cf352e28b43bc07c1c
          path: higgyui
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            higgyui/package-lock.json
            docs/site/package-lock.json
      - name: Install library dependencies
        run: npm ci
        working-directory: higgyui
      - name: Install docs dependencies
        run: npm ci
        working-directory: docs/site
      - name: Build and export docs
        run: npm run build
        working-directory: docs/site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
